# Server Block 1: HTTP to HTTPS Redirect
# This block catches all traffic on port 80 and permanently redirects it
# to the secure HTTPS version of the site. This is a security best practice.
server {
    listen 80;
    server_name packandgo.today www.packandgo.today;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Server Block 2: Main HTTPS Application Server
# This block handles all the secure traffic on port 443.
server {
    listen 443 ssl http2;
    server_name packandgo.today www.packandgo.today;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SSL Certificate Configuration
    # These paths point to the certificates that will be mounted into the container.
    ssl_certificate /etc/letsencrypt/live/packandgo.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packandgo.today/privkey.pem;

    # SSL Security Enhancements
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:7000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Serve the frontend application (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css text/js text/xml text/javascript application/javascript application/xml+rss application/json;
}
